<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>motor reels-animados</title>
<style>
  @font-face { font-family: 'Barlow'; font-weight: 600; src: url('fontes/barlow-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Barlow'; font-weight: 700; src: url('fontes/barlow-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 500; src: url('fontes/inter-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 700; src: url('fontes/inter-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 800; src: url('fontes/inter-latin-800-normal.woff2') format('woff2'); }

  :root { --titulo: 'Barlow', sans-serif; --ui: 'Inter', sans-serif; --roxo: #9966FF; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff; }
  #palco { position: absolute; inset: 0; overflow: hidden; }

  /* temas de cena: uma cor de destaque por tema */
  .cena { position: absolute; inset: 0; overflow: hidden; display: none; background: var(--fundo); color: var(--tinta); }
  .t-branco { --fundo: #FFFFFF; --tinta: #000000; --destaque: #9966FF; --sec: #4A4A4A; --superficie: #F1EBFF; --tom: #F4F0FF; --sobre-destaque: #FFFFFF; }
  .t-lilas  { --fundo: #F1EBFF; --tinta: #000000; --destaque: #9966FF; --sec: #4A4A4A; --superficie: #FFFFFF; --tom: #E6DBFF; --sobre-destaque: #FFFFFF; }
  .t-roxo   { --fundo: #9966FF; --tinta: #FFFFFF; --destaque: #000000; --sec: rgba(255,255,255,.82); --superficie: rgba(255,255,255,.2); --tom: #A97BFF; --sobre-destaque: #FFFFFF; }
  .t-preto  { --fundo: #000000; --tinta: #FFFFFF; --destaque: #9966FF; --sec: #BDBDBD; --superficie: #1F1F1F; --tom: #141414; --sobre-destaque: #FFFFFF; }

  .ambiente { position: absolute; inset: 0; }
  .ambiente svg { position: absolute; inset: 0; }
  .conteudo { position: absolute; inset: 0; transform-origin: 540px 800px; }

  .el { position: absolute; left: 90px; right: 90px; display: none; }
  b { color: var(--destaque); font-weight: inherit; }

  /* frase cinética */
  .frase .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.06em; margin-right: 0.24em; }
  .frase .w > span { display: inline-block; }
  .frase.g { font: 700 124px/1.0 var(--titulo); letter-spacing: -1px; }
  .frase.m { font: 700 96px/1.02 var(--titulo); letter-spacing: -0.5px; }
  .frase.p { font: 700 70px/1.08 var(--titulo); }
  .frase.centro-x { text-align: center; }
  .sub { font: 700 50px/1.2 var(--ui); color: var(--sec); margin-top: 26px; }

  /* número */
  .numero .topo { font: 700 52px/1.15 var(--ui); color: var(--sec); margin-bottom: 12px; }
  .numero .valor { font: 700 236px/0.92 var(--titulo); color: var(--destaque); letter-spacing: -4px; white-space: nowrap; }
  .numero .rotulo { font: 700 60px/1.12 var(--ui); margin-top: 18px; }
  .fonte { font: 500 30px/1.25 var(--ui); color: var(--sec); margin-top: 26px; }

  /* ícones */
  .ico svg { display: block; overflow: visible; }
  .ico .tr { fill: none; stroke: var(--tinta); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .ico .tr.d { stroke: var(--destaque); }
  .icone { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .icone .disco { width: 420px; height: 420px; border-radius: 50%; background: var(--superficie); display: grid; place-items: center; }
  .icone .rot { font: 700 72px/1.08 var(--titulo); margin-top: 40px; max-width: 900px; }
  .icones { display: flex; justify-content: space-between; align-items: flex-start; }
  .icones .cel { width: 280px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .icones .disco { width: 230px; height: 230px; border-radius: 50%; background: var(--superficie); display: grid; place-items: center; }
  .icones .rot { font: 700 48px/1.1 var(--ui); margin-top: 22px; }

  /* personagem */
  .personagem { display: flex; flex-direction: column; align-items: center; }
  .personagem .nome { font: 700 60px/1.1 var(--titulo); margin-top: 18px; text-align: center; }
  .personagem .desc { font: 700 44px/1.2 var(--ui); color: var(--sec); margin-top: 6px; text-align: center; }
  .balao { position: absolute; left: 50%; top: 0; translate: 40px -100%; background: var(--superficie); color: var(--tinta);
           font: 700 50px/1.15 var(--ui); padding: 26px 34px; border-radius: 34px 34px 34px 8px; max-width: 380px; width: max-content; }
  .t-branco .balao, .t-lilas .balao { background: #000; color: #fff; }

  /* barras */
  .linha-comp { margin-top: 34px; }
  .linha-comp .rot { font: 700 52px/1.1 var(--ui); margin-bottom: 14px; display: flex; justify-content: space-between; }
  .linha-comp .rot .num { color: var(--sec); }
  .linha-comp.dest .rot .num { color: var(--destaque); }
  .linha-comp .trilho { height: 76px; background: var(--superficie); border-radius: 18px; overflow: hidden; }
  .linha-comp .barra { height: 100%; background: var(--sec); border-radius: 18px; transform-origin: 0 50%; }
  .linha-comp.dest .barra { background: var(--destaque); }
  .h { font: 700 76px/1.04 var(--titulo); margin-bottom: 18px; }

  /* gráfico */
  .grafico svg { display: block; overflow: visible; }
  .grafico .eixo { font: 700 40px var(--ui); fill: var(--sec); }
  .grafico .final { font: 700 72px var(--titulo); fill: var(--destaque); }

  /* moedas */
  .moedas .pilhas { display: flex; justify-content: space-around; align-items: flex-end; height: 600px; }
  .moedas .col { width: 230px; position: relative; height: 100%; }
  .moedas .coin { position: absolute; left: 15px; width: 200px; height: 46px; border-radius: 50%; background: var(--destaque);
                  box-shadow: inset 0 -9px 0 rgba(0,0,0,.25); }
  .t-roxo .moedas .coin { background: #fff; box-shadow: inset 0 -9px 0 rgba(0,0,0,.18); }
  .moedas .val { position: absolute; left: -70px; right: -70px; white-space: nowrap; text-align: center; font: 700 64px var(--titulo); color: var(--destaque); }
  .t-roxo .moedas .val { color: #fff; }
  .moedas .rots { display: flex; justify-content: space-around; margin-top: 18px; }
  .moedas .rots div { width: 230px; text-align: center; font: 700 46px/1.1 var(--ui); }

  /* lista */
  .item { display: flex; align-items: center; gap: 28px; margin-top: 30px; }
  .item .chk { width: 70px; height: 70px; border-radius: 18px; background: var(--superficie); flex: none; position: relative; }
  .item .chk svg { position: absolute; inset: 0; }
  .item .txt { font: 700 64px/1.1 var(--ui); }
  .item .mask { overflow: hidden; }
  .item .vazio { height: 26px; width: 320px; border-radius: 13px; background: var(--superficie); }

  /* linha do tempo */
  .tempo { position: relative; }
  .tempo .eixo { position: absolute; left: 34px; top: 20px; width: 8px; border-radius: 4px; background: var(--superficie); }
  .tempo .eixo i { position: absolute; inset: 0; background: var(--destaque); border-radius: 4px; transform-origin: 50% 0; }
  .tempo .marco { position: relative; padding-left: 110px; height: 170px; }
  .tempo .ponto { position: absolute; left: 14px; top: 8px; width: 48px; height: 48px; border-radius: 50%; background: var(--destaque); }
  .tempo .quando { font: 700 64px/1 var(--titulo); color: var(--destaque); }
  .tempo .oque { font: 700 46px/1.15 var(--ui); margin-top: 8px; }

  /* rosca */
  .rosca { display: flex; flex-direction: column; align-items: center; }
  .rosca svg { display: block; }
  .rosca .centro { font: 700 150px var(--titulo); fill: var(--tinta); }
  .rosca .leg { display: flex; gap: 40px; margin-top: 30px; font: 700 46px var(--ui); flex-wrap: wrap; justify-content: center; }
  .rosca .leg i { display: inline-block; width: 34px; height: 34px; border-radius: 8px; margin-right: 14px; vertical-align: -4px; }

  /* cta e aviso */
  .cta { display: flex; justify-content: center; }
  .cta .caixa { background: var(--tinta); color: var(--fundo); border-radius: 30px; padding: 40px 56px 46px; font: 800 74px/1.1 var(--ui); text-align: center; }
  .cta .chip { display: inline-block; background: var(--roxo); color: #fff; border-radius: 18px; padding: 4px 24px; }
  .t-roxo .cta .chip { background: #000; }
  .aviso { text-align: center; }
  .aviso span { display: inline-block; font: 500 30px/1.25 var(--ui); color: var(--sec); padding: 8px 18px; border-radius: 10px; background: var(--superficie); }

  /* legenda */
  #legenda { position: absolute; z-index: 5; left: 90px; right: 90px; top: 1300px; display: none; flex-wrap: wrap; justify-content: center;
             align-items: center; gap: 4px 14px; translate: 0 -50%; }
  #legenda .p { font: 800 62px/1.18 var(--ui); padding: 0 12px; border-radius: 14px; display: inline-block; color: var(--leg-tinta); }
  #legenda .p.ativo { background: var(--leg-destaque); color: #fff; }

  #guias { position: absolute; inset: 0; display: none; pointer-events: none; z-index: 9; }
  #guias div { position: absolute; left: 0; right: 0; background: rgba(255,0,60,.22); border: 2px dashed rgba(255,0,60,.8); }
  #guias .lat { top: 0; bottom: 0; width: 90px; background: rgba(255,170,0,.12); border: none; }
</style>
</head>
<body>
<div id="palco">
  <div id="cenas"></div>
  <div id="legenda"></div>
  <div id="guias">
    <div style="top:0;height:320px"></div>
    <div style="top:1450px;bottom:0"></div>
    <div class="lat" style="left:0"></div>
    <div class="lat" style="right:0;left:auto"></div>
  </div>
</div>
<script src="icones.js"></script>
<script src="engine.js"></script>
</body>
</html>
