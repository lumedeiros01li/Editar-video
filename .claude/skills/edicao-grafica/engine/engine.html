<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>motor edicao-grafica</title>
<style>
  @font-face { font-family: 'Barlow'; font-weight: 600; src: url('fontes/barlow-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Barlow'; font-weight: 700; src: url('fontes/barlow-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 500; src: url('fontes/inter-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 700; src: url('fontes/inter-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 800; src: url('fontes/inter-latin-800-normal.woff2') format('woff2'); }

  :root {
    --roxo: #9966FF;
    --roxo-claro: #F1EBFF;
    --preto: #000000;
    --cinza: #4A4A4A;
    --branco: #FFFFFF;
    --titulo: 'Barlow', sans-serif;
    --ui: 'Inter', sans-serif;
    --emoji: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #palco { position: absolute; inset: 0; overflow: hidden; }

  /* vídeo de fundo */
  #bg { position: absolute; inset: 0; will-change: transform; }
  #bg img { width: 1080px; height: 1920px; object-fit: cover; display: block; }
  #veu { position: absolute; inset: 0; background: #000; opacity: 0; }

  .camada { position: absolute; display: none; }

  /* legenda */
  #legenda { position: absolute; left: 90px; right: 90px; top: 1290px; transform-origin: 50% 50%;
             display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
             gap: 4px 14px; translate: 0 -50%; }
  #legenda .p { font: 800 64px/1.18 var(--ui); color: var(--branco); padding: 0 12px; border-radius: 14px;
                text-shadow: 0 4px 0 rgba(0,0,0,.55), 0 0 18px rgba(0,0,0,.35); display: inline-block; }
  #legenda .p.ativo { background: var(--roxo); text-shadow: none; }

  /* titulo (gancho) */
  .titulo { left: 90px; max-width: 900px; background: var(--branco); border-radius: 24px; padding: 26px 40px 30px; }
  .titulo .t { font: 700 82px/1.04 var(--titulo); color: var(--preto); letter-spacing: -0.5px; }
  .titulo b, .cartao b { color: var(--roxo); font-weight: 700; }

  /* palavra de impacto */
  .palavra { left: 0; right: 0; text-align: center; }
  .palavra .linha { display: inline-block; overflow: hidden; padding: 0 10px; }
  .palavra .l { display: inline-block; font: 700 156px/1 var(--titulo); color: var(--branco); text-transform: uppercase;
                text-shadow: 0 6px 0 rgba(0,0,0,.5); }
  .palavra .barra { height: 16px; width: 520px; margin: 18px auto 0; background: var(--roxo); border-radius: 8px; transform-origin: 0 50%; }

  /* cartões brancos */
  .cartao { left: 130px; width: 820px; background: var(--branco); border-radius: 32px; padding: 44px 52px 48px; }
  .cartao .topo { font: 700 44px/1.15 var(--ui); color: var(--cinza); margin-bottom: 10px; }
  .cartao .h { font: 700 64px/1.05 var(--titulo); color: var(--preto); margin-bottom: 26px; }
  .cartao .valor { font: 700 172px/0.95 var(--titulo); color: var(--roxo); letter-spacing: -2px; white-space: nowrap; }
  .cartao .rotulo { font: 700 50px/1.15 var(--ui); color: var(--preto); margin-top: 14px; }
  .cartao .fonte { font: 500 28px/1.2 var(--ui); color: var(--cinza); margin-top: 22px; }

  .item { display: flex; align-items: center; gap: 24px; margin-top: 22px; }
  .item .chk { width: 52px; height: 52px; border-radius: 12px; background: var(--roxo-claro); flex: none; position: relative; }
  .item .chk svg { position: absolute; inset: 0; }
  .item .txt { font: 700 52px/1.12 var(--ui); color: var(--preto); }
  .item .mask { overflow: hidden; }
  .item .vazio { height: 22px; width: 280px; border-radius: 11px; background: #EDEDED; }

  .linha-comp { margin-top: 24px; }
  .linha-comp .rot { font: 700 46px/1.1 var(--ui); color: var(--preto); margin-bottom: 12px; display: flex; justify-content: space-between; }
  .linha-comp .rot .num { color: var(--cinza); }
  .linha-comp.dest .rot .num { color: var(--roxo); }
  .linha-comp .trilho { height: 58px; background: #EFEFEF; border-radius: 14px; overflow: hidden; }
  .linha-comp .barra { height: 100%; background: var(--cinza); border-radius: 14px; transform-origin: 0 50%; }
  .linha-comp.dest .barra { background: var(--roxo); }

  .grafico svg { display: block; overflow: visible; }
  .grafico .eixo { font: 700 36px var(--ui); fill: var(--cinza); }
  .grafico .final { font: 700 60px var(--titulo); fill: var(--roxo); }

  /* emoji */
  .emoji { font: 128px/1 var(--emoji); transform-origin: 50% 60%; translate: -50% -50%; }

  /* aviso legal */
  .aviso { left: 90px; right: 90px; top: 1392px; text-align: center; }
  .aviso span { display: inline-block; font: 500 30px/1.25 var(--ui); color: var(--branco); background: rgba(0,0,0,.62);
                padding: 8px 18px; border-radius: 10px; }

  /* chamada final */
  .cta { left: 90px; right: 90px; top: 1270px; display: flex; justify-content: center; }
  .cta .caixa { background: var(--preto); color: var(--branco); border-radius: 24px; padding: 30px 44px 34px;
                font: 800 58px/1.1 var(--ui); text-align: center; max-width: 900px; }
  .cta .chip { display: inline-block; background: var(--roxo); color: var(--branco); border-radius: 14px; padding: 2px 18px; }

  /* guias de zona segura (só na folha de contato) */
  #guias { position: absolute; inset: 0; display: none; pointer-events: none; }
  #guias div { position: absolute; left: 0; right: 0; background: rgba(255,0,60,.22); border: 2px dashed rgba(255,0,60,.8); }
  #guias .lat { top: 0; bottom: 0; width: 90px; background: rgba(255,170,0,.12); border: none; }
</style>
</head>
<body>
<div id="palco">
  <div id="bg"><img id="frame" alt=""></div>
  <div id="veu"></div>
  <div id="camadas"></div>
  <div id="legenda"></div>
  <div id="guias">
    <div style="top:0;height:320px"></div>
    <div style="top:1450px;bottom:0"></div>
    <div class="lat" style="left:0"></div>
    <div class="lat" style="right:0;left:auto"></div>
  </div>
</div>
<script src="engine.js"></script>
</body>
</html>
