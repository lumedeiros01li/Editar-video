<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:G;font-weight:500;src:url(/node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-500-normal.woff2)}
@font-face{font-family:G;font-weight:700;src:url(/node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-700-normal.woff2)}
@font-face{font-family:SM;font-weight:700;src:url(/node_modules/@fontsource/space-mono/files/space-mono-latin-700-normal.woff2)}
@font-face{font-family:I;font-weight:600;src:url(/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:I;font-weight:800;src:url(/node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, FPS = 30, SRC_FPS = 24;
const MODE = new URLSearchParams(location.search).get('box') || 'brut';
const QUESTION = 'Sua família sabe onde está o seu dinheiro?';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let D, AVATAR, NFR = { v1: 751, v2: 836 };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
const cache = new Map();
function srcFrame(v, idx) {
  const k = v + idx;
  if (!cache.has(k)) { if (cache.size > 12) cache.delete(cache.keys().next().value); cache.set(k, loadImg(`/f/${v}/${String(idx).padStart(5, '0')}.jpg`)); }
  return cache.get(k);
}
function segAt(t) { let k = 0; D.segments.forEach((s, i) => { if (s.t <= t + 1e-6) k = i; }); return k; }

// ---- subtitle phrases (film style: whole phrase, no word highlight) ----
let PH = [];
const FN = new Set(['a','o','as','os','de','da','do','das','dos','e','em','na','no','num','que','pra','para','com','um','uma','se','mas','por','é','tem','onde','quem','sua','seu','essa','ter','vai']);
function buildPhrases() {
  // 1) clauses: break on punctuation or pauses
  const ws = D.words, cl = []; let c = null;
  ws.forEach((w, i) => {
    const prev = ws[i - 1];
    if (!c || (prev && /[.?!,]$/.test(prev.w)) || (prev && w.t - prev.e > 0.3)) { c = []; cl.push(c); }
    c.push(w);
  });
  // 2) split long clauses into balanced chunks, never ending a line on a short function word
  const len = a => a.map(w => w.w).join(' ').length;
  for (const c of cl) {
    const n = Math.ceil(len(c) / 30), total = len(c), chunks = [];
    let cur = [];
    c.forEach((w, i) => {
      cur.push(w);
      const done = chunks.reduce((a, b) => a + len(b) + 1, 0) + len(cur);
      if (chunks.length < n - 1 && done >= total * (chunks.length + 1) / n - 3 && i < c.length - 1) {
        while (cur.length > 1 && FN.has(cur[cur.length - 1].w.toLowerCase().replace(/[^a-zà-ú]/g, ''))) cur.pop();
        chunks.push(cur); cur = c.slice(c.indexOf(cur[cur.length - 1]) + 1, i + 1);
      }
    });
    if (cur.length) chunks.push(cur);
    for (const ch of chunks) PH.push({ t: ch[0].t, text: ch.map(w => w.w).join(' '), last: ch[ch.length - 1] });
  }
  PH.forEach((p, k) => {
    p.text = p.text.replace(/[.,]$/, '');
    const n = PH[k + 1];
    p.e = n ? Math.min(n.t, p.last.e + 0.35) : D.duration;
  });
}
function drawSubtitle(t) {
  const p = PH.find(p => t >= p.t && t < p.e); if (!p) return;
  const fs = 40; ctx.font = `500 ${fs}px G`;
  const tw = ctx.measureText(p.text).width, px = 22, h = fs + 26, w = tw + px * 2;
  const x = Math.round(W / 2 - w / 2), y = 1450;
  ctx.fillStyle = '#0B0B0B'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#FFFFFF'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText(p.text, x + px, y + h / 2 + 1);
}

// ---- top boxes ----
function wrap(text, maxw) {
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const tryl = cur ? cur + ' ' + w : w; if (ctx.measureText(tryl).width > maxw && cur) { lines.push(cur); cur = w; } else cur = tryl; }
  lines.push(cur); return lines;
}
function brutalBox() {
  const x = 110, y = 200, w = 860, pad = 40;
  ctx.font = '700 58px G'; const lines = wrap(QUESTION, w - pad * 2);
  const lh = 66, h = 110 + lines.length * lh + 34;
  // hard offset shadow
  ctx.fillStyle = '#0B0B0B'; ctx.fillRect(x + 14, y + 14, w, h);
  // tail (shadow + body)
  const tx = x + 120, ty = y + h;
  ctx.beginPath(); ctx.moveTo(tx + 14, ty + 14 - 2); ctx.lineTo(tx + 14 + 70, ty + 14 - 2); ctx.lineTo(tx + 14 + 10, ty + 14 + 70); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#F1EEE6'; ctx.fillRect(x, y, w, h);
  ctx.lineWidth = 6; ctx.strokeStyle = '#0B0B0B'; ctx.strokeRect(x, y, w, h);
  ctx.beginPath(); ctx.moveTo(tx, ty - 3); ctx.lineTo(tx + 70, ty - 3); ctx.lineTo(tx + 10, ty + 70); ctx.closePath();
  ctx.fillStyle = '#F1EEE6'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + 10, ty + 70); ctx.lineTo(tx + 70, ty); ctx.stroke();
  ctx.fillStyle = '#F1EEE6'; ctx.fillRect(tx + 3, ty - 6, 64, 6);   // open the border where the tail joins
  // tag
  ctx.font = '700 26px SM'; const tag = 'PENSE NISSO ANTES'; const tgw = ctx.measureText(tag).width + 28;
  ctx.fillStyle = '#0B0B0B'; ctx.fillRect(x + pad, y + 36, tgw, 44);
  ctx.fillStyle = '#F1EEE6'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.fillText(tag, x + pad + 14, y + 59);
  ctx.fillStyle = '#0B0B0B'; ctx.font = '700 58px G'; ctx.textBaseline = 'alphabetic';
  lines.forEach((l, i) => ctx.fillText(l, x + pad, y + 110 + 50 + i * lh));
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function igBox() {
  const w = 760, x = (W - w) / 2, y = 250, r = 34;
  ctx.font = '800 50px I'; const lines = wrap(QUESTION, w - 90);
  const head = 120, lh = 62, h = head + 50 + lines.length * lh + 40;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.28)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
  ctx.fillStyle = '#fff'; rrect(x, y, w, h, r); ctx.fill(); ctx.restore();
  // header band (Instagram purple->orange gradient)
  ctx.save(); rrect(x, y, w, h, r); ctx.clip();
  const g = ctx.createLinearGradient(x, y, x + w, y + head); g.addColorStop(0, '#833AB4'); g.addColorStop(0.55, '#E1306C'); g.addColorStop(1, '#F77737');
  ctx.fillStyle = g; ctx.fillRect(x, y, w, head); ctx.restore();
  ctx.fillStyle = '#fff'; ctx.font = '600 36px I'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Faça uma pergunta', W / 2, y + head / 2 + 16);
  // avatar
  const ar = 52, ax = W / 2, ay = y;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ax, ay, ar + 7, 0, 7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(ax, ay, ar, 0, 7); ctx.clip();
  ctx.drawImage(AVATAR, 330, 700, 420, 420, ax - ar, ay - ar, ar * 2, ar * 2); ctx.restore();
  ctx.fillStyle = '#111'; ctx.font = '800 50px I';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, y + head + 50 + i * lh + 4));
}

window.renderFrame = async function (f) {
  const t = f / FPS, k = segAt(t), s = D.segments[k];
  const st = clamp(s.s + (t - s.t), s.s, s.e - 0.001);
  const idx = clamp(Math.floor(st * SRC_FPS + 1e-6) + 1, 1, NFR[s.src]);
  ctx.drawImage(await srcFrame(s.src, idx), 0, 0, W, H);
  if (MODE === 'ig') igBox(); else brutalBox();
  drawSubtitle(t);
  return cv.toDataURL('image/jpeg', 0.94);
};
(async () => {
  D = await (await fetch('/cues.json')).json();
  AVATAR = await loadImg('/f/v1/00060.jpg');
  for (const f of ['500 40px G', '700 58px G', '700 26px SM', '600 36px I', '800 50px I']) await document.fonts.load(f);
  D.words[11].w = 'Sabe?'; D.words[17].w = 'sabe?'; D.words[62].w = 'Aí';
  buildPhrases();
  window.NFRAMES = Math.round(D.duration * FPS);
  window.PH = PH;
  window.READY = true;
})();
</script></body></html>
