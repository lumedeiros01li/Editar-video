<html><head><meta charset="utf-8">

<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, FPS = 30, SRC_FPS = 24;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let D, EMO = {}, NFR = { v1: 751, v2: 836 };
const ANCHOR = { v1: [0.50, 0.50], v2: [0.47, 0.47] };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const eio = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const eout = p => 1 - Math.pow(1 - p, 3);
const ein = p => p * p * p;
const back = p => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
const frameCache = new Map();
async function srcFrame(v, idx) {
  const key = v + idx;
  if (!frameCache.has(key)) {
    if (frameCache.size > 12) frameCache.delete(frameCache.keys().next().value);
    frameCache.set(key, loadImg(`/f/${v}/${String(idx).padStart(5, '0')}.jpg`));
  }
  return frameCache.get(key);
}

// ---------- captions ----------
let GROUPS = [];
function buildGroups() {
  const ws = D.words; let g = null;
  const clean = w => w.replace(/[.,!;:]/g, '').toUpperCase();
  for (let i = 0; i < ws.length; i++) {
    const w = ws[i], txt = clean(w.w);
    const prev = ws[i - 1];
    const brk = !g || g.words.length >= 3 || (g.chars + txt.length > 15 && g.words.length >= 1) ||
      (prev && w.t - prev.e > 0.35) || (prev && /[.?!,]$/.test(prev.w));
    if (brk) { g = { words: [], chars: 0 }; GROUPS.push(g); }
    g.words.push({ txt, t: w.t, e: w.e }); g.chars += txt.length + 1;
  }
  GROUPS.forEach((g, k) => {
    g.t = g.words[0].t;
    const last = g.words[g.words.length - 1];
    const nxt = GROUPS[k + 1];
    g.e = nxt ? Math.min(nxt.words[0].t, last.e + 0.5) : D.duration;
  });
}

// ---------- camera ----------
const ZP = [1.06, 1.16, 1.08, 1.2, 1.05, 1.14, 1.09, 1.18];
function segAt(t) { let k = 0; for (let i = 0; i < D.segments.length; i++) if (D.segments[i].t <= t + 1e-6) k = i; return k; }
function camera(t, k) {
  const s = D.segments[k];
  const len = (s.e - s.s), p = clamp((t - s.t) / len, 0, 1);
  let z;
  if (Math.abs(s.t - 18.9) < 0.01) z = lerp(1.12, 1.3, eio(p));          // dramatic slow push
  else if (k === D.segments.length - 1) z = lerp(1.06, 1.14, eio(p));
  else z = ZP[k % ZP.length] + 0.04 * eio(p);
  // transition-in punch
  for (const tr of D.transitions) {
    const d = t - tr.t;
    if (tr.kind === 'punch' && d >= 0 && d < 0.25) z *= 1 + 0.075 * (1 - eout(d / 0.25));
  }
  let dx = 7 * Math.sin(t * 0.83) + 4 * Math.sin(t * 2.1 + 1.3);
  let dy = 6 * Math.sin(t * 0.67 + 0.4) + 3 * Math.sin(t * 1.9);
  for (const e of D.elements) if (e.type === 'shake' && t >= e.tin && t < e.tout) {
    const a = e.amp * (1 - (t - e.tin) / (e.tout - e.tin));
    dx += a * Math.sin(t * 90); dy += a * Math.cos(t * 77);
  }
  return { z, dx, dy };
}
function drawVideo(img, v, cam, offX = 0) {
  const [ax, ay] = ANCHOR[v];
  const z = cam.z, w = W * z, h = H * z;
  let x0 = ax * W * (1 - z) + cam.dx, y0 = ay * H * (1 - z) + cam.dy;
  x0 = clamp(x0, W - w, 0); y0 = clamp(y0, H - h, 0);
  ctx.drawImage(img, x0 + offX, y0, w, h);
  if (offX) { ctx.drawImage(img, x0 + offX - Math.sign(offX) * w, y0, w, h); }
}

// ---------- elements ----------
function emojiState(e, t) {
  const age = t - e.tin, left = e.tout - t;
  let x = e.x, y = e.y, size = e.size, rot = 0, alpha = 1, sc = 1;
  const pin = clamp(age / 0.38, 0, 1);
  sc = back(pin) ; if (pin < 1 && sc < 0) sc = 0;
  alpha = clamp(age / 0.12, 0, 1);
  if (e.anim === 'drop') { y = e.y - 260 * (1 - eout(clamp(age / 0.45, 0, 1))); sc = age < .45 ? 1 : 1 + 0.12 * Math.exp(-(age - .45) * 9) * Math.sin((age - .45) * 30); }
  if (e.anim === 'rise') { y = e.y + 120 * (1 - eout(clamp(age / 0.5, 0, 1))); }
  if (e.anim === 'wobble') rot = 0.25 * Math.sin(age * 7) * Math.exp(-age * 1.2) + 0.06 * Math.sin(age * 3);
  if (e.anim === 'shake' && age < 0.6) x += 14 * Math.sin(age * 60) * (1 - age / 0.6);
  if (e.anim === 'flip') sc *= 1 - 0.18 * Math.max(0, Math.sin(age * 14)) ** 6;
  if (e.anim === 'search') { x += 40 * Math.cos(age * 4); y += 28 * Math.sin(age * 4); rot = 0.15 * Math.sin(age * 4); }
  if (e.anim === 'pulse') sc *= 1 + 0.05 * Math.sin(age * 7);
  if (e.anim === 'spin') rot = 0.5 * Math.sin(age * 5) * Math.exp(-age * 0.8);
  // idle float
  y += 9 * Math.sin(age * 2.4 + e.x * 0.01); rot += 0.04 * Math.sin(age * 1.7 + e.x);
  if (e.moveTo) { const [mx, my, mt, md, ms] = e.moveTo; const p = eio(clamp((t - mt) / md, 0, 1)); x = lerp(x, mx, p); y = lerp(y, my, p); size = lerp(size, ms, p); }
  if (e.flyTo) { const [fx, fy, ft, fd] = e.flyTo; const p = ein(clamp((t - ft) / fd, 0, 1)); x = lerp(x, fx, p); y = lerp(y, fy, p); sc *= 1 - p; if (p >= 1) alpha = 0; }
  if (left < 0.2) { const q = clamp(left / 0.2, 0, 1); sc *= lerp(0.6, 1, eout(q)); alpha *= q; }
  return { x, y, size: size * sc, rot, alpha };
}
function drawEmoji(e, t) {
  const st = emojiState(e, t); if (st.alpha <= 0 || st.size <= 1) return;
  const img = EMO[e.code];
  ctx.save(); ctx.globalAlpha = st.alpha; ctx.translate(st.x, st.y); ctx.rotate(st.rot);
  // soft glow plate
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, st.size * 0.62);
  g.addColorStop(0, 'rgba(255,255,255,0.28)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, st.size * 0.62, 0, 7); ctx.fill();
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 34; ctx.shadowOffsetY = 14;
  ctx.drawImage(img, -st.size / 2, -st.size / 2, st.size, st.size);
  ctx.restore();
  if (e.ring) {
    const [r0, r1] = e.ring; if (t >= r0) {
      const p = clamp((t - r0) / (r1 - r0), 0, 1);
      ctx.save(); ctx.globalAlpha = st.alpha; ctx.lineCap = 'round';
      ctx.lineWidth = 16; ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.arc(st.x, st.y, st.size * 0.62, 0, 7); ctx.stroke();
      ctx.strokeStyle = '#22C55E'; ctx.shadowColor = '#22C55E'; ctx.shadowBlur = 20;
      ctx.beginPath(); ctx.arc(st.x, st.y, st.size * 0.62, -Math.PI / 2, -Math.PI / 2 + eio(p) * Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function drawLabel(e, t) {
  const age = t - e.tin, left = e.tout - t;
  const pin = eout(clamp(age / 0.28, 0, 1)), pout = clamp(left / 0.18, 0, 1);
  const a = Math.min(pin, pout); if (a <= 0) return;
  let fs = e.small ? 40 : 54;
  ctx.font = `800 ${fs}px M`;
  let tw = ctx.measureText(e.text).width;
  const maxw = e.small ? 440 : 960;
  if (tw > maxw) { fs *= maxw / tw; ctx.font = `800 ${fs}px M`; tw = ctx.measureText(e.text).width; }
  const padX = fs * 0.62, h = fs * 1.75, w = tw + padX * 2;
  ctx.save(); ctx.globalAlpha = a;
  ctx.translate(e.x, e.y + 34 * (1 - pin)); const s = lerp(0.85, 1, back(clamp(age / 0.3, 0, 1)));
  ctx.scale(s, s);
  ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  ctx.fillStyle = e.color; rrect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(e.text, 0, fs * 0.05);
  ctx.restore();
}
function drawBigText(e, t) {
  const age = t - e.tin, left = e.tout - t;
  const a = Math.min(clamp(age / 0.1, 0, 1), clamp(left / 0.18, 0, 1)); if (a <= 0) return;
  const s = back(clamp(age / 0.35, 0, 1));
  ctx.save(); ctx.globalAlpha = a; ctx.translate(e.x, e.y); ctx.scale(s, s);
  ctx.font = `900 ${e.size}px M`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (e.pill) {
    const tw = ctx.measureText(e.text).width, h = e.size * 1.45, w = tw + e.size;
    ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 24; ctx.fillStyle = e.pill; rrect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.fillStyle = '#fff'; ctx.fillText(e.text, 0, e.size * 0.05);
  } else {
    ctx.lineJoin = 'round'; ctx.lineWidth = e.size * 0.12; ctx.strokeStyle = 'rgba(0,0,0,0.8)';
    ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 20; ctx.strokeText(e.text, 0, 0);
    ctx.shadowColor = 'transparent'; ctx.fillStyle = '#fff'; ctx.fillText(e.text, 0, 0);
  }
  ctx.restore();
}
function drawBurst(e, t) {
  const p = (t - e.tin) / (e.tout - e.tin); if (p < 0 || p > 1) return;
  ctx.save();
  for (let i = 0; i < 16; i++) {
    const ang = i / 16 * Math.PI * 2 + rnd(i) * 0.3, r = 120 + eout(p) * (180 + rnd(i + 9) * 120);
    const x = e.x + Math.cos(ang) * r, y = e.y + Math.sin(ang) * r, sz = (1 - p) * (10 + rnd(i + 3) * 10);
    ctx.globalAlpha = 1 - p; ctx.fillStyle = i % 3 ? '#FFD60A' : '#FFFFFF';
    ctx.beginPath(); // 4-point star
    for (let k = 0; k < 8; k++) { const rr = k % 2 ? sz * 0.35 : sz * 1.4, aa = k / 8 * Math.PI * 2; ctx.lineTo(x + Math.cos(aa) * rr, y + Math.sin(aa) * rr); }
    ctx.fill();
  }
  ctx.restore();
}
function drawArrow(e, t) {
  const age = t - e.tin; if (age < 0 || t > e.tout) return;
  const a = clamp(age / 0.2, 0, 1), b = 14 * Math.sin(age * 7);
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#fff'; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 14;
  for (let i = 0; i < 2; i++) { const y = e.y + b + i * 34; ctx.globalAlpha = a * (i ? 0.55 : 1); ctx.beginPath(); ctx.moveTo(e.x - 34, y - 16); ctx.lineTo(e.x, y + 16); ctx.lineTo(e.x + 34, y - 16); ctx.stroke(); }
  ctx.restore();
}
function vignette(strength) {
  const g = ctx.createRadialGradient(W / 2, H * 0.48, H * 0.28, W / 2, H * 0.48, H * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${strength})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function topShade() { // keeps animations readable over the bright car ceiling/windows
  const g = ctx.createLinearGradient(0, 0, 0, 760);
  g.addColorStop(0, 'rgba(10,6,25,0.38)'); g.addColorStop(1, 'rgba(10,6,25,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 760);
}

// ---------- captions draw ----------
function drawCaptions(t) {
  const g = GROUPS.find(g => t >= g.t && t < g.e); if (!g) return;
  const age = t - g.t;
  const s = lerp(0.82, 1, back(clamp(age / 0.18, 0, 1)));
  const fs = 84; ctx.font = `900 ${fs}px M`;
  const sp = ctx.measureText(' ').width + 30;
  // layout into lines (max width 940)
  const items = g.words.map(w => ({ ...w, w: ctx.measureText(w.txt).width }));
  const lines = [[]]; let lw = 0;
  for (const it of items) { if (lw && lw + sp + it.w > 940) { lines.push([]); lw = 0; } lines[lines.length - 1].push(it); lw += (lw ? sp : 0) + it.w; }
  const lh = fs * 1.3, y0 = 1490 - (lines.length - 1) * lh / 2;
  ctx.save(); ctx.translate(W / 2, y0); ctx.scale(s, s); ctx.translate(-W / 2, -y0);
  ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  lines.forEach((ln, li) => {
    const tot = ln.reduce((a, b) => a + b.w, 0) + sp * (ln.length - 1);
    let x = W / 2 - tot / 2; const y = y0 + li * lh;
    for (const it of ln) {
      const active = t >= it.t && t < Math.max(it.e, it.t + 0.12);
      const spoken = t >= it.t;
      ctx.save();
      const cx = x + it.w / 2; ctx.translate(cx, y);
      if (active) {
        const pa = clamp((t - it.t) / 0.1, 0, 1); const ss = 1 + 0.08 * back(pa) - 0.0;
        ctx.scale(ss, ss);
        ctx.fillStyle = '#7B2FF7'; ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 16;
        rrect(-it.w / 2 - 16, -fs * 0.62, it.w + 32, fs * 1.22, 22); ctx.fill(); ctx.shadowColor = 'transparent';
      }
      ctx.textAlign = 'center';
      ctx.lineWidth = 14; ctx.strokeStyle = 'rgba(0,0,0,0.85)';
      if (!active) { ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6; }
      ctx.strokeText(it.txt, 0, fs * 0.04);
      ctx.shadowColor = 'transparent';
      ctx.fillStyle = active ? '#FFFFFF' : (spoken ? '#FFE14D' : '#FFFFFF');
      ctx.fillText(it.txt, 0, fs * 0.04);
      ctx.restore();
      x += it.w + sp;
    }
  });
  ctx.restore();
}

// ---------- frame ----------
async function frameImg(t) {
  const k = segAt(t), s = D.segments[k];
  const st = clamp(s.s + (t - s.t), s.s, s.e - 0.001);
  const idx = clamp(Math.floor(st * SRC_FPS + 1e-6) + 1, 1, NFR[s.src]);
  return { img: await srcFrame(s.src, idx), v: s.src, k };
}
window.renderFrame = async function (f) {
  const t = f / FPS;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const { img, v, k } = await frameImg(t);
  const cam = camera(t, k);
  // grade (dramatic)
  let gray = 0, dark = 0;
  for (const e of D.elements) if (e.type === 'grade') {
    const p = Math.min(clamp((t - e.tin) / 0.25, 0, 1), clamp((e.tout + 0.15 - t) / 0.3, 0, 1));
    gray = Math.max(gray, e.gray * p); dark = Math.max(dark, e.dark * p);
  }
  if (gray || dark) ctx.filter = `grayscale(${gray}) brightness(${1 - dark * 0.45}) contrast(${1 + dark * 0.3})`;
  // whip transition
  let whip = null;
  for (const tr of D.transitions) if (tr.kind === 'whip') { const d = t - tr.t; if (d >= -0.17 && d < 0.17) whip = { tr, d }; }
  if (whip) {
    const { tr, d } = whip, dir = tr.dir;
    const off = d < 0 ? -dir * W * 0.55 * ein(clamp((d + 0.17) / 0.17, 0, 1)) : dir * W * 0.55 * (1 - eout(clamp(d / 0.17, 0, 1)));
    const vel = Math.max(40, (1 - Math.abs(d) / 0.17) * 260);
    const N = 9;
    for (let i = 0; i < N; i++) { ctx.globalAlpha = 1 / (i + 1); drawVideo(img, v, cam, off + (i / (N - 1) - 0.5) * vel * -dir); }
    ctx.globalAlpha = 1;
  } else {
    // punch: short zoom blur on first 2 frames
    let pb = 0; for (const tr of D.transitions) if (tr.kind === 'punch') { const d = t - tr.t; if (d >= 0 && d < 0.07) pb = 1 - d / 0.07; }
    drawVideo(img, v, cam);
    if (pb > 0) { for (let i = 1; i <= 3; i++) { ctx.globalAlpha = 0.22 * pb; drawVideo(img, v, { ...cam, z: cam.z * (1 + 0.02 * i) }); } ctx.globalAlpha = 1; }
  }
  ctx.filter = 'none';
  // dip to dark
  for (const tr of D.transitions) if (tr.kind === 'dip') {
    const d = t - tr.t; let a = 0;
    if (d >= -0.12 && d < 0) a = (d + 0.12) / 0.12; else if (d >= 0 && d < 0.3) a = 1 - eout(d / 0.3);
    if (a > 0) { ctx.fillStyle = `rgba(0,0,0,${0.85 * a})`; ctx.fillRect(0, 0, W, H); }
  }
  // flash on punch
  for (const tr of D.transitions) { const d = t - tr.t; if (tr.kind !== 'dip' && d >= 0 && d < 0.1) { ctx.fillStyle = `rgba(255,255,255,${0.09 * (1 - d / 0.1)})`; ctx.fillRect(0, 0, W, H); } }
  vignette(0.42 + dark * 0.4);
  // red glow
  for (const e of D.elements) if (e.type === 'redglow' && t >= e.tin && t < e.tout) {
    const a = Math.min(clamp((t - e.tin) / 0.2, 0, 1), clamp((e.tout - t) / 0.25, 0, 1)) * (0.55 + 0.25 * Math.sin((t - e.tin) * 9));
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.72);
    g.addColorStop(0, 'rgba(224,54,79,0)'); g.addColorStop(1, `rgba(224,54,79,${0.55 * a})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  const anyTop = D.elements.some(e => (e.type === 'emoji' || e.type === 'label') && t >= e.tin - 0.2 && t < e.tout + 0.2);

  for (const e of D.elements) {
    if (t < e.tin || t >= e.tout) continue;
    if (e.type === 'emoji') drawEmoji(e, t);

  for (const e of D.elements) {
    if (t < e.tin || t >= e.tout) continue;
    if (e.type === 'label') drawLabel(e, t);
    else if (e.type === 'bigtext') drawBigText(e, t);
    else if (e.type === 'burst') drawBurst(e, t);

  return cv.toDataURL('image/jpeg', 0.93);
};
(async () => {
  D = await (await fetch('/cues.json')).json();
  const codes = [...new Set(D.elements.filter(e => e.type === 'emoji').map(e => e.code))];
  await Promise.all(codes.map(async c => EMO[c] = await loadImg(`/node_modules/@lobehub/fluent-emoji-3d/assets/${c}.webp`)));
  await document.fonts.load('900 80px M'); await document.fonts.load('800 50px M');
  buildGroups();
  window.NFRAMES = Math.round(D.duration * FPS);
  window.READY = true;
})();
</script></body></html>
